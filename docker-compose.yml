version: "3.9"

services:
  db:
    image: postgres:16
    container_name: executioner-db
    restart: always
    environment:
      POSTGRES_USER: executioner
      POSTGRES_PASSWORD: executioner
      POSTGRES_DB: executioner_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    container_name: executioner-api
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
